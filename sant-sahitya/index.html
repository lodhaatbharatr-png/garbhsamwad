<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e12">
<meta name="description" content="संत साहित्य — हरिपाठ, तुकाराम महाराज, अभंग आणि प्रत्येक ओळीचा सोपा अर्थ">
<title>संत साहित्य • हरिनाम • अभंग</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#100d12;--panel:#171219;--panel2:#1d1720;--text:#f7f1e9;--muted:#a89da4;--gold:#e6ad70;--gold2:#f4c58d;--line:rgba(255,255,255,.1);--green:#82d0a0;--shadow:0 12px 35px rgba(0,0,0,.42)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari",sans-serif}button{font:inherit}body{background:radial-gradient(circle at 50% -15%,rgba(230,173,112,.13),transparent 43%),radial-gradient(circle at 100% 100%,rgba(112,73,104,.12),transparent 38%),var(--bg)}
.app{height:100dvh;padding:max(5px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));display:flex;justify-content:center}.shell{width:min(720px,100%);height:100%;display:flex;flex-direction:column;gap:5px;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-icon{width:32px;height:32px;border:1px solid rgba(230,173,112,.42);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:15px;background:rgba(230,173,112,.06)}.brand h1{font-family:"Noto Serif Devanagari",serif;font-size:1.1rem;line-height:1.05;margin:0;font-weight:800}.brand p{font-size:.67rem;color:var(--muted);margin:2px 0 0}.actions{display:flex;align-items:center;gap:6px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--gold2);border-radius:99px;padding:5px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}.icon-btn{width:31px;height:31px;border:1px solid rgba(130,208,160,.3);border-radius:50%;background:rgba(130,208,160,.07);color:var(--green);display:grid;place-items:center;cursor:pointer}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar{display:none}.tab{flex:1;min-width:max-content;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:6px 9px;background:rgba(255,255,255,.025);color:var(--muted);font-size:.75rem;font-weight:700;cursor:pointer}.tab.active{background:var(--gold);border-color:var(--gold);color:#351f12}.progress{height:2px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;flex:0 0 auto}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff);transition:width .3s ease}
.reader{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);border-radius:17px;background:linear-gradient(180deg,rgba(28,21,29,.97),rgba(16,12,18,.99));box-shadow:var(--shadow);overflow:hidden}.reader-head{padding:10px 15px 9px;border-bottom:1px solid var(--line);background:rgba(24,18,26,.94);backdrop-filter:blur(12px);flex:0 0 auto}.eyebrow{font-size:.68rem;color:var(--gold);font-weight:800;margin-bottom:2px}.title{font-family:"Noto Serif Devanagari",serif;font-size:clamp(.95rem,3.6vw,1.15rem);font-weight:800;line-height:1.3;margin:0}.theme{font-size:.68rem;color:var(--muted);margin-top:3px}.body{overflow-y:auto;min-height:0;padding:12px 13px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}.body::-webkit-scrollbar{width:4px}.body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.line-card{border:1px solid rgba(255,255,255,.075);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));padding:12px 13px;margin-bottom:9px}.line-no{font-size:.64rem;color:var(--gold);font-weight:800;margin-bottom:4px}.verse{font-family:"Noto Serif Devanagari",serif;font-size:clamp(.93rem,3.7vw,1.08rem);line-height:1.75;font-weight:700;color:#fff8f0;margin:0}.meaning{margin-top:9px;padding-top:8px;border-top:1px dashed rgba(230,173,112,.2);font-size:.82rem;line-height:1.65;color:#d9d0d2}.meaning b{color:var(--gold2);font-size:.72rem}.day-box{margin-bottom:10px;padding:11px 12px;border-radius:13px;background:rgba(230,173,112,.055);border:1px solid rgba(230,173,112,.18)}.day-box h3{margin:0;color:var(--gold2);font-size:.85rem}.day-box p{margin:4px 0 0;color:#d4cbd0;font-size:.75rem;line-height:1.55}.practice{margin-top:7px;color:#f0e7df;font-size:.76rem;line-height:1.55}.practice i{color:var(--green);margin-right:5px}
.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:5px 3px 0;flex:0 0 auto}.nav{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;background:rgba(255,255,255,.035);color:#fff;display:grid;place-items:center;cursor:pointer}.nav:disabled{opacity:.25;border-color:var(--line)}.status{text-align:center;color:var(--muted);font-size:.67rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{text-align:center;color:#776d75;font-size:.63rem;padding:0 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:10px}.drawer.open{display:flex}.drawer-card{width:min(720px,100%);max-height:75dvh;overflow:auto;background:#19131b;border:1px solid var(--gold);border-radius:18px;padding:14px;box-shadow:0 20px 60px #000}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.drawer-head h2{font-family:"Noto Serif Devanagari",serif;font-size:1rem;margin:0}.close{border:0;background:rgba(255,255,255,.07);color:#fff;width:30px;height:30px;border-radius:50%}.day-btn{width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#eee;border-radius:11px;padding:9px 10px;margin:4px 0;cursor:pointer}.day-btn strong{color:var(--gold2);font-size:.78rem}.day-btn span{display:block;color:var(--muted);font-size:.67rem;margin-top:2px}
@media(min-width:600px){.body{padding-left:18px;padding-right:18px}.line-card{padding:14px 16px}.verse{font-size:1.1rem}}
</style>
</head>
<body>
<div class="app"><main class="shell">
  <header class="top">
    <div class="brand"><div class="brand-icon"><i class="fa-solid fa-dharmachakra"></i></div><div><h1>संत साहित्य</h1><p>हरिनाम • अभंग • संतवाणी</p></div></div>
    <div class="actions"><span class="pill" id="dayPill">दिवस १</span><button class="icon-btn" id="shareBtn" aria-label="शेअर"><i class="fa-solid fa-share-nodes"></i></button></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="progress"><i id="progressFill" style="width:0%"></i></div>
  <section class="reader">
    <div class="reader-head"><div class="eyebrow" id="author"></div><h2 class="title" id="title"></h2><div class="theme" id="theme"></div></div>
    <div class="body" id="content"></div>
  </section>
  <div class="bottom"><button class="nav" id="prev"><i class="fa-solid fa-chevron-left"></i></button><div class="status" id="status"></div><button class="nav" id="next"><i class="fa-solid fa-chevron-right"></i></button></div>
  <div class="footer">संतवाणी वाचा • अर्थ समजा • नामस्मरण करा</div>
</main></div>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><h2>दिवस निवडा</h2><button class="close" id="close"><i class="fa-solid fa-xmark"></i></button></div><div id="dayList"></div></div></div>
<script>
const state={data:null,category:'haripath',workIndex:0};
const $=id=>document.getElementById(id);
async function init(){state.data=await fetch('data.json').then(r=>r.json());renderTabs();render();}
function works(){return state.data.works.filter(w=>w.category===state.category)}
function current(){return works()[state.workIndex]||works()[0]}
function renderTabs(){$('tabs').innerHTML=state.data.app.categories.map(c=>`<button class="tab ${c.id===state.category?'active':''}" data-cat="${c.id}">${c.label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;state.workIndex=0;renderTabs();render()})}
function render(){const w=current();if(!w)return;const ws=works();$('author').textContent=w.author;$('title').textContent=w.title;$('theme').textContent=w.theme||'';$('dayPill').textContent=`दिवस ${w.day||1}`;$('content').innerHTML=w.lines.map((x,i)=>`<article class="line-card"><div class="line-no">ओळ ${i+1}</div><p class="verse">${x.text}</p><div class="meaning"><b>अर्थ</b><br>${x.meaning}</div></article>`).join('');$('status').textContent=`${state.workIndex+1} / ${ws.length} • ${w.author}`;$('prev').disabled=state.workIndex===0;$('next').disabled=state.workIndex===ws.length-1;$('progressFill').style.width=`${((state.workIndex+1)/Math.max(ws.length,1))*100}%`;$('content').scrollTop=0}
$('prev').onclick=()=>{if(state.workIndex>0){state.workIndex--;render()}};$('next').onclick=()=>{if(state.workIndex<works().length-1){state.workIndex++;render()}};
$('dayPill').onclick=()=>openDays();$('dayPill').style.cursor='pointer';
function openDays(){$('dayList').innerHTML=state.data.days.map(d=>`<button class="day-btn" data-work="${d.workId}"><strong>दिवस ${d.day} — ${d.title}</strong><span>${d.practice}</span></button>`).join('');document.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>{const w=state.data.works.find(x=>x.id===b.dataset.work);if(w){state.category=w.category;state.workIndex=Math.max(0,works().findIndex(x=>x.id===w.id));renderTabs();render();$('drawer').classList.remove('open')}});$('drawer').classList.add('open')}
$('close').onclick=()=>$('drawer').classList.remove('open');$('drawer').onclick=e=>{if(e.target.id==='drawer')$('drawer').classList.remove('open')};
$('shareBtn').onclick=async()=>{const w=current();const text=`${w.title}\n${w.lines[0]?.text||''}\n\nसंत साहित्य`;if(navigator.share){try{await navigator.share({title:w.title,text})}catch(e){}}else{await navigator.clipboard?.writeText(text);alert('वाचन मजकूर कॉपी झाला.')}};
let sx=0,sy=0;$('content').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});$('content').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){if(dx<0)$('next').click();else $('prev').click()}},{passive:true});
init().catch(e=>{$('content').innerHTML='<div class="line-card"><p class="verse">संत साहित्य लोड होत आहे…</p><div class="meaning">डेटा उपलब्ध नसल्यास पान पुन्हा उघडा.</div></div>';console.error(e)});
</script>
</body>
</html>
