<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0f">
  <meta name="description" content="३० दिवसांचा दैनिक गर्भसंवाद">
  <title>३० दिवसांचा दैनिक गर्भसंवाद</title>

  <!-- Marathi-friendly font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0b0a0f;
      --bg-soft: #111017;
      --card: rgba(27, 24, 34, 0.94);
      --card-border: rgba(255, 255, 255, 0.09);
      --text: #fff9f5;
      --content: #e5dedb;
      --muted: #aaa2a6;
      --accent: #e3a8c4;
      --accent-soft: #c984a9;
      --primary: #9c5e7e;
      --primary-dark: #7e4865;
      --line: rgba(255,255,255,0.09);
      --shadow: 0 30px 80px rgba(0,0,0,0.48);
      --radius: 28px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { width: 100%; min-height: 100%; background: var(--bg); }
    body {
      margin: 0; width: 100%; min-height: 100dvh;
      background: radial-gradient(circle at 50% -10%, rgba(190, 105, 145, 0.17), transparent 42%),
                  radial-gradient(circle at 100% 80%, rgba(110, 75, 110, 0.10), transparent 35%), var(--bg);
      color: var(--text);
      font-family: "Noto Sans Devanagari", "Nirmala UI", "Mangal", system-ui, sans-serif;
      overflow-x: hidden;
    }
    button { font-family: inherit; }

    .app {
      min-height: 100dvh; display: flex; justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      position: relative;
    }
    .shell {
      width: min(720px, 100%);
      min-height: calc(100dvh - max(18px, env(safe-area-inset-top)) - max(18px, env(safe-area-inset-bottom)));
      display: flex; flex-direction: column; justify-content: center; gap: 14px;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 2px 5px 0; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(145deg, rgba(227,168,196,0.25), rgba(156,94,126,0.13));
      border: 1px solid rgba(227,168,196,0.18); color: var(--accent);
    }
    .brand-icon svg { width: 18px; height: 18px; }
    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-title { font-size: 0.82rem; font-weight: 800; color: #fff8f4; }
    .brand-subtitle { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.02em; }
    .counter { color: var(--muted); font-size: 0.78rem; font-weight: 700; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.035); }

    .progress-track { width: 100%; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary-dark), var(--accent)); transition: width 350ms ease; }

    .card {
      width: 100%; min-height: min(610px, 68dvh); max-height: 72dvh;
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      border-radius: var(--radius); border: 1px solid var(--card-border);
      background: linear-gradient(145deg, rgba(32,29,39,0.97), rgba(20,18,25,0.97));
      box-shadow: var(--shadow); touch-action: pan-y; outline: none;
    }
    .card::before {
      content: ""; position: absolute; width: 230px; height: 230px; top: -150px; right: -80px;
      border-radius: 50%; background: rgba(211,142,176,0.11); filter: blur(25px); pointer-events: none;
    }
    .card-inner { position: relative; z-index: 2; height: 100%; padding: 28px 25px 22px; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .card-inner::-webkit-scrollbar { display: none; }

    .day-row { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .day-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px rgba(227,168,196,0.55); }
    .day { color: var(--accent); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; }

    .title { color: var(--text); font-size: clamp(1.65rem, 7vw, 2.45rem); line-height: 1.28; font-weight: 900; letter-spacing: -0.025em; margin: 0 0 20px; }
    .content { color: var(--content); font-size: clamp(1.02rem, 4.6vw, 1.18rem); line-height: 1.95; font-weight: 500; letter-spacing: 0.005em; }

    .divider { width: 42px; height: 3px; border-radius: 99px; margin: 22px 0 18px; background: linear-gradient(90deg, var(--accent), transparent); }
    .mantra { margin-top: auto; padding-top: 19px; text-align: center; color: #d9a7be; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.02em; border-top: 1px solid var(--line); }

    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; width: 100%; }
    .nav-button {
      min-height: 48px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,0.045);
      color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      font-size: 0.91rem; font-weight: 700; cursor: pointer; transition: transform 150ms ease, background 150ms ease;
    }
    .nav-button:active { transform: scale(0.96); }
    .nav-button:hover { background: rgba(255,255,255,0.075); }
    .nav-button.primary {
      background: linear-gradient(145deg, #a36585, #87516f); border-color: rgba(255,255,255,0.06);
      box-shadow: 0 8px 24px rgba(117,55,83,0.25);
    }
    .nav-button:disabled { opacity: 0.28; cursor: not-allowed; box-shadow: none; }
    .progress-number { min-width: 58px; text-align: center; color: var(--muted); font-size: 0.76rem; font-weight: 700; }
    .swipe-hint { text-align: center; color: #777177; font-size: 0.65rem; margin-top: -2px; opacity: 0.85; }

    .content-animation { animation: cardContentIn 320ms ease both; }
    @keyframes cardContentIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    function App() {
      const [days, setDays] = useState([
        ["दिवस १", "प्रेम आणि सुरक्षितता", "माझ्या बाळा, आई आणि बाबा दोघेही तुझ्यावर मनापासून प्रेम करतात. तू आमच्यासाठी अमूल्य आहेस. तुझ्या मनात प्रेम, शांतता आणि सुरक्षिततेची भावना सदैव राहो."]
      ]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [animKey, setAnimKey] = useState(0);

      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      useEffect(() => {
        // Fetch external days.json file from data folder
        fetch('./data/days.json')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setDays(data);
            }
          })
          .catch(err => console.log("JSON load fallback active", err));
      }, []);

      const totalDays = days.length;

      const goToPrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
          setAnimKey(prev => prev + 1);
        }
      };

      const goToNext = () => {
        if (currentIndex < totalDays - 1) {
          setCurrentIndex(prev => prev + 1);
          setAnimKey(prev => prev + 1);
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowLeft") goToPrev();
          if (e.key === "ArrowRight") goToNext();
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [currentIndex, totalDays]);

      const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
      const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
      const handleTouchEnd = () => {
        const distance = touchStartX.current - touchEndX.current;
        if (distance > 50) goToNext();
        else if (distance < -50) goToPrev();
      };

      const currentDayData = days[currentIndex] || ["दिवस १", "संवाद", "माहिती उपलब्ध नाही."];
      const [dayLabel, titleText, contentText] = currentDayData;
      const progressPercent = ((currentIndex + 1) / totalDays) * 100;

      return React.createElement("div", { className: "app" },
        React.createElement("div", { className: "shell" },
          React.createElement("header", { className: "topbar" },
            React.createElement("div", { className: "brand" },
              React.createElement("div", { className: "brand-icon" },
                React.createElement("i", { "data-lucide": "heart" })
              ),
              React.createElement("div", { className: "brand-text" },
                React.createElement("span", { className: "brand-title" }, "दैनिक गर्भसंवाद"),
                React.createElement("span", { className: "brand-subtitle" }, "प्रेम • संस्कार • प्रार्थना")
              )
            ),
            React.createElement("div", { className: "counter" }, `दिवस ${currentIndex + 1} / ${totalDays}`)
          ),
          React.createElement("div", { className: "progress-track" },
            React.createElement("div", { className: "progress-fill", style: { width: `${progressPercent}%` } })
          ),
          React.createElement("main", {
            className: "card",
            onTouchStart: handleTouchStart,
            onTouchMove: handleTouchMove,
            onTouchEnd: handleTouchEnd
          },
            React.createElement("div", { key: animKey, className: "card-inner content-animation" },
              React.createElement("div", { className: "day-row" },
                React.createElement("div", { className: "day-dot" }),
                React.createElement("span", { className: "day" }, dayLabel)
              ),
              React.createElement("h1", { className: "title" }, titleText),
              React.createElement("div", { className: "divider" }),
              React.createElement("div", { className: "content" }, contentText),
              React.createElement("div", { className: "mantra" }, "✨ आई-बाबांचे प्रेम आणि शुभ आशीर्वाद ✨")
            )
          ),
          React.createElement("nav", { className: "nav" },
            React.createElement("button", { className: "nav-button", onClick: goToPrev, disabled: currentIndex === 0 }, "← मागील"),
            React.createElement("div", { className: "progress-number" }, `${Math.round(progressPercent)}%`),
            React.createElement("button", { className: "nav-button primary", onClick: goToNext, disabled: currentIndex === totalDays - 1 }, "पुढील →")
          ),
          React.createElement("div", { className: "swipe-hint" }, "बोटाने सरकवून किंवा एरो की वापरून पुढील दिवस पाहा")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
